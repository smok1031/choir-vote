<meta property="og:title" content="합창곡 선호도 조사">
<meta property="og:description" content="주제마다 가장 부르고 싶은 곡을 하나씩 골라 주세요. 모두 투표하면 1위 곡이 공개됩니다.">

<style>
:root {
  --paper: #F7F3EA;
  --card: #FFFDF8;
  --ink: #1F2A44;
  --muted: #646976;
  --line: #DED6C4;
  --accent: #8C2F39;
  --accent-soft: #F3E3E3;
  --on-accent: #FFFFFF;
  --ok: #2F6B4F;
  --warn-bg: #FBF0D9;
  --warn-ink: #7A5410;
  --shadow: 0 1px 2px rgba(31, 42, 68, .06), 0 4px 16px rgba(31, 42, 68, .06);
  --serif: "Noto Serif KR", "Nanum Myeongjo", serif;
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15181F;
    --card: #1D212B;
    --ink: #ECE6D8;
    --muted: #A3A6AF;
    --line: #333846;
    --accent: #D4707A;
    --accent-soft: #3A2328;
    --on-accent: #15181F;
    --ok: #79C29C;
    --warn-bg: #3A3020;
    --warn-ink: #F0CF8A;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding: 28px 16px calc(120px + env(safe-area-inset-bottom));
}

/* 머리: 오선 위의 제목 */
.staff { display: block; width: 100%; height: 34px; color: var(--line); margin-bottom: 18px; }
.eyebrow {
  font-size: 13px; font-weight: 600; letter-spacing: .08em;
  color: var(--accent); margin: 0 0 6px;
}
h1 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(26px, 7vw, 32px);
  line-height: 1.25;
  margin: 0 0 10px;
  word-break: keep-all;
}
.lead { color: var(--muted); margin: 0 0 18px; word-break: keep-all; }
.meta {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  font-size: 14px; color: var(--muted);
  padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
}
.meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* 곡 목록 */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { font-weight: 700; font-size: 15px; margin-bottom: 10px; padding: 0; }
.songs { display: grid; gap: 10px; }
.song {
  position: relative;
  display: flex; align-items: center; gap: 14px;
  min-height: 64px;
  padding: 14px 16px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: border-color .15s, background-color .15s, transform .08s;
}
.song:active { transform: scale(.99); }
.song input { position: absolute; opacity: 0; pointer-events: none; }
.mark {
  flex: none;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  font-family: var(--serif); font-weight: 700; font-size: 17px;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  color: var(--ink);
  transition: background-color .15s, color .15s, border-color .15s;
}
.title { flex: 1; font-weight: 600; font-size: 17px; word-break: keep-all; overflow-wrap: anywhere; }
.check {
  flex: none; width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid; place-items: center;
}
.check svg { width: 14px; height: 14px; opacity: 0; color: var(--on-accent); }
.song:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.song:has(input:checked) .mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.song:has(input:checked) .check { background: var(--accent); border-color: var(--accent); }
.song:has(input:checked) .check svg { opacity: 1; }
.song:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.song.is-checked { border-color: var(--accent); background: var(--accent-soft); }
.song.is-checked .mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.song.is-checked .check { background: var(--accent); border-color: var(--accent); }
.song.is-checked .check svg { opacity: 1; }

/* 하단 고정 버튼 */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--paper) 70%, transparent);
}
.dock-inner { max-width: 520px; margin: 0 auto; }
.btn {
  appearance: none; border: 0; cursor: pointer;
  width: 100%; min-height: 54px;
  border-radius: 14px;
  font: inherit; font-size: 17px; font-weight: 700;
  background: var(--accent); color: var(--on-accent);
  transition: opacity .15s;
}
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.hint { text-align: center; font-size: 13px; color: var(--muted); margin: 8px 0 0; }

/* 상태 카드 */
.panel {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 22px 20px;
  box-shadow: var(--shadow);
}
.panel h2 { font-family: var(--serif); font-size: 21px; margin: 0 0 8px; word-break: keep-all; }
.panel p { margin: 0 0 6px; color: var(--muted); word-break: keep-all; }
.picked {
  display: flex; align-items: center; gap: 12px;
  margin: 16px 0 6px; padding: 14px 16px;
  border-radius: 12px; background: var(--accent-soft);
}
.picked .mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.picked .title { color: var(--ink); }
.done-icon {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); margin-bottom: 14px;
}
.notice {
  margin: 0 0 18px; padding: 12px 14px;
  border-radius: 12px; background: var(--warn-bg); color: var(--warn-ink);
  font-size: 14px; word-break: keep-all;
}

/* 결과 */
.results { display: grid; gap: 14px; margin-top: 4px; }
.r-row { display: grid; gap: 6px; }
.r-head { display: flex; align-items: baseline; gap: 10px; }
.r-head .mark { width: 28px; height: 28px; font-size: 14px; }
.r-title { flex: 1; font-weight: 600; word-break: keep-all; overflow-wrap: anywhere; }
.r-num { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.r-num small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.r-bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.r-bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 6px; transition: width .8s cubic-bezier(.2,.7,.2,1); }
.r-row.top .r-bar i { background: var(--accent); }
.r-row.top .mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.r-tag { font-size: 12px; font-weight: 700; color: var(--accent); }
.r-mine { font-size: 12px; color: var(--muted); }
.panel .footnote { font-size: 13px; color: var(--muted); margin: 20px 0 0; padding-top: 14px; border-top: 1px dashed var(--line); word-break: keep-all; }
.song:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.song:has(input:focus:not(:focus-visible)) { outline: none; }

/* 확인 대화상자 */
dialog {
  border: 0; padding: 0; margin: auto auto 0;
  width: 100%; max-width: 520px;
  background: var(--card); color: var(--ink);
  border-radius: 20px 20px 0 0;
}
dialog::backdrop { background: rgba(10, 12, 18, .45); }
.sheet { padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); }
.sheet h2 { font-family: var(--serif); font-size: 20px; margin: 0 0 6px; }
.sheet p { margin: 0 0 18px; color: var(--muted); word-break: keep-all; }
.sheet .picked { margin: 0 0 18px; }
.sheet .btns { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }

.loading { display: grid; gap: 10px; }
.skel { height: 64px; border-radius: 14px; background: var(--line); opacity: .5; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) {
  .skel { animation: none; }
  .r-bar i, .song, .mark { transition: none; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

[hidden] { display: none !important; }

/* 주제 구역 */
.topic { margin: 0 0 30px; scroll-margin-top: 16px; }
.topic-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
.topic-no {
  flex: none; font-size: 12px; font-weight: 700; letter-spacing: .06em;
  color: var(--accent); border: 1.5px solid var(--accent); border-radius: 999px;
  padding: 1px 9px; transform: translateY(-2px);
}
.topic-title { font-family: var(--serif); font-size: 20px; font-weight: 700; margin: 0; flex: 1; word-break: keep-all; overflow-wrap: anywhere; }
.topic-state { flex: none; font-size: 13px; color: var(--muted); }
.topic-state.ok { color: var(--ok); font-weight: 600; }
.topic.missing .topic-state { color: var(--accent); font-weight: 600; }
.topic-done {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  border-radius: 14px; background: var(--card); border: 1.5px dashed var(--line);
}
.topic-done .mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.topic-done small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.sheet .picks { display: grid; gap: 8px; margin: 0 0 18px; }
.sheet .picks .picked { margin: 0; }
.picked .lbl { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.panel + .panel { margin-top: 16px; }
.panel > p + .results-topic { margin-top: 18px; }
.results-topic + .results-topic { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
.winner {
  display: flex; align-items: center; gap: 12px; padding: 16px;
  border-radius: 14px; background: var(--accent-soft); border: 1.5px solid var(--accent);
}
.winner + .winner { margin-top: 8px; }
.winner .mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.winner .title { font-size: 18px; }
.crown { flex: none; font-size: 13px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 3px 10px; }
.results-topic h3 { font-family: var(--serif); font-size: 18px; margin: 0 0 4px; word-break: keep-all; }
.results-topic .sub { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

<main class="wrap">
  <svg class="staff" viewBox="0 0 320 34" preserveAspectRatio="none" aria-hidden="true">
    <g stroke="currentColor" stroke-width="1"><line x1="0" y1="2" x2="320" y2="2"/><line x1="0" y1="9.5" x2="320" y2="9.5"/><line x1="0" y1="17" x2="320" y2="17"/><line x1="0" y1="24.5" x2="320" y2="24.5"/><line x1="0" y1="32" x2="320" y2="32"/></g>

</div>

    <div class="btns">
      <button class="btn secondary" value="cancel" type="submit">다시 고르기</button>
      <button class="btn" value="ok" type="submit" id="cOk">투표하기</button>
    </div>
  </form>
</dialog>

      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(parts));
      return Array.prototype.map.call(new Uint8Array(buf), function (x) { return (x + 256).toString(16).slice(1); }).join("");
    } catch (e) {
      return fallbackHash(parts);
    }
  }

  // ===== 서버 호출 ================================================
  async function rpc(fn, args) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
    try {
      var res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(args),
        signal: ctrl ? ctrl.signal : undefined,
        cache: "no-store"
      });
      if (!res.ok) {
        var err = new Error("http_" + res.status);
        err.status = res.status;
        throw err;
      }
      return await res.json();
    } finally { clearTimeout(t); }
  }

  // ===== 시간 표시 ================================================
  function renderMeta() {
    var g = state.group, meta = $("meta");
    var html = "<span>참여 <b>" + Number(g.completed || 0) + " / " + Number(g.expected || 0) + "</b>명 완료</span>";
    html += g.closed ? "<span><b>투표 종료</b></span>" : "<span>" + Number(g.expected || 0) + "명이 모두 투표하면 주제별 1위 곡 공개</span>";
    meta.innerHTML = html;
    meta.hidden = false;
  }
  // 30초마다 확인: 인원이 다 차면 결과로, 운영진이 새 투표를 시작하면 투표지로 바뀜
  function startPolling() {
    if (state.timer) return;
    state.timer = setInterval(function () {
      if (document.visibilityState === "visible" && !state.busy && !dlg.open) load(true);
    }, 30000);
  }

  // ===== 화면 그리기 ==============================================
  function mark(i) { return '<span class="mark" aria-hidden="true">' + (i + 1) + "</span>"; }
  function topics() { return (state.group && state.group.topics) || []; }
  function hasMine(t) { return typeof t.mine === "number"; }
  function openTopics() { return topics().filter(function (t) { return !hasMine(t); }); }

  function renderBallot() {
    var html = "";
    topics().forEach(function (t, ti) {
      html += '<section class="topic" id="topic-' + ti + '" data-topic="' + esc(t.id) + '" aria-labelledby="th-' + ti + '">' +
        '<div class="topic-head"><span class="topic-no">주제 ' + (ti + 1) + '</span>' +
        '<h2 class="topic-title" id="th-' + ti + '">' + esc(t.title) + "</h2>" +
        '<span class="topic-state"></span></div>';
      if (hasMine(t)) {
        html += '<div class="topic-done">' + mark(t.mine) +
          '<span class="title">' + esc((t.songs || [])[t.mine]) + "<small>이미 투표한 주제입니다</small></span></div>";
      } else {
        html += '<fieldset><legend class="sr">' + esc(t.title) + ": 한 곡을 골라 주세요</legend><div class=\"songs\">";
        (t.songs || []).forEach(function (s, i) {
          var name = "song-" + ti;
          html += '<label class="song" data-i="' + i + '">' +
            '<input type="radio" name="' + name + '" value="' + i + '"' + (state.selected[t.id] === i ? " checked" : "") + ">" +
            mark(i) + '<span class="title">' + esc(s) + "</span>" +
            '<span class="check">' + CHECK_SVG + "</span></label>";
        });
        html += "</div></fieldset>";
      }
      html += "</section>";
    });
    view.innerHTML = html;
    dock.hidden = false;
    view.querySelectorAll(".topic").forEach(function (sec) {
      var tid = sec.dataset.topic;
      sec.querySelectorAll('input[type="radio"]').forEach(function (r) {
        r.addEventListener("change", function () {
          state.selected[tid] = Number(r.value);
          sec.classList.remove("missing");
          syncChecked();
        });
      });
    });
    syncChecked();
  }

  function syncChecked() {
    view.querySelectorAll(".topic").forEach(function (sec) {
      var tid = sec.dataset.topic;
      var t = topics().filter(function (x) { return x.id === tid; })[0];
      var stEl = sec.querySelector(".topic-state");
      sec.querySelectorAll(".song").forEach(function (el) {
        el.classList.toggle("is-checked", Number(el.dataset.i) === state.selected[tid]);
      });
      if (!stEl || !t) return;
      if (hasMine(t)) { stEl.textContent = "투표 완료"; stEl.className = "topic-state ok"; }
      else if (typeof state.selected[tid] === "number") { stEl.textContent = (state.selected[tid] + 1) + "번 선택"; stEl.className = "topic-state ok"; }
      else { stEl.textContent = "미선택"; stEl.className = "topic-state"; }
    });
    var open = openTopics();
    var picked = open.filter(function (t) { return typeof state.selected[t.id] === "number"; }).length;
    var all = open.length > 0 && picked === open.length;
    voteBtn.disabled = state.busy || picked === 0;
    voteBtn.dataset.ready = all ? "1" : "0";
    if (state.busy) voteBtn.textContent = "제출하는 중...";
    else if (all) voteBtn.textContent = "투표하기";
    else if (picked === 0) voteBtn.textContent = open.length > 1 ? "주제마다 한 곡씩 골라 주세요" : "곡을 골라 주세요";
    else voteBtn.textContent = (open.length - picked) + "개 주제가 남았습니다 (" + picked + "/" + open.length + ")";
  }

  function renderVoted() {
    dock.hidden = true;
    var g = state.group;
    var left = Math.max(0, Number(g.expected || 0) - Number(g.completed || 0));
    var html = '<section class="panel">' +
      '<div class="done-icon">' + CHECK_SVG + "</div>" +
      "<h2>투표가 접수되었습니다</h2>" +
      "<p>참여해 주셔서 감사합니다. " + (left > 0 ? "아직 " + left + "명이 남았습니다. " : "") +
      "모두 투표하면 이 페이지에서 주제별 1위 곡이 공개됩니다. 열어 두시면 자동으로 바뀝니다.</p>";
    topics().forEach(function (t) {
      if (!hasMine(t)) return;
      html += '<div class="picked">' + mark(t.mine) + '<span class="title"><span class="lbl">' + esc(t.title) + "</span>" +
        esc((t.songs || [])[t.mine]) + "</span></div>";
    });
    html += "</section>";
    view.innerHTML = html;
    var icon = view.querySelector(".done-icon svg");
    if (icon) { icon.style.width = "22px"; icon.style.height = "22px"; }
  }

  function renderResults() {
    dock.hidden = true;
    var g = state.group;
    var html = '<section class="panel"><h2>투표 결과</h2><p>' + Number(g.expected || 0) + "명이 모두 투표했습니다. 주제별 1위 곡입니다.</p>";
    topics().forEach(function (t) {
      var w = t.winners || [];
      var songs = t.songs || [];
      html += '<div class="results-topic"><h3>' + esc(t.title) + "</h3>";
      if (!w.length) {
        html += '<p class="sub">표가 없습니다</p>';
      } else {
        if (w.length > 1) html += '<p class="sub">공동 1위 ' + w.length + "곡</p>";
        w.forEach(function (i) {
          html += '<div class="winner">' + mark(i) + '<span class="title">' + esc(songs[i]) +
            (t.mine === i ? ' <span class="r-mine">내 선택</span>' : "") + "</span>" +
            '<span class="crown">1위</span></div>';
        });
      }
      html += "</div>";
    });
    if (Number(g.flagged) > 0) {
      html += '<p class="footnote">같은 기기에서 다시 투표한 것으로 의심되는 표 ' + Number(g.flagged) +
        "표가 포함되어 있습니다. 같은 기종의 휴대폰을 쓰는 다른 단원일 수도 있어 제외하지 않았습니다.</p>";
    }
    html += "</section>";
    view.innerHTML = html;
  }

  function renderError(msg, retry) {
    dock.hidden = true;
    view.innerHTML = '<section class="panel"><h2>' + esc(msg) + "</h2>" +
      "<p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>" +
      (retry ? '<p style="margin-top:14px"><button class="btn secondary" type="button" id="retry">다시 시도</button></p>' : "") +
      "</section>";
    var b = $("retry");
    if (b) b.addEventListener("click", load);
  }

  // ===== 흐름 =====================================================
  async function load(silent) {
    try {
      if (!state.device) state.device = await getDeviceId();
      if (!state.fp) state.fp = await getFingerprint();
      var g = await rpc("choir_group", { p_group: GROUP_ID, p_device: state.device });
      if (!g || !g.topics || !g.topics.length) {
        $("meta").hidden = true;
        dock.hidden = true;
        view.innerHTML = '<section class="panel"><h2>투표를 찾을 수 없습니다</h2><p>받은 링크가 맞는지 운영진에게 확인해 주세요.</p></section>';
        return;
      }
      state.group = g;
      // 서버에서 사라진 주제나 곡 범위를 벗어난 선택은 버림
      var keep = {};
      g.topics.forEach(function (t) {
        var s = state.selected[t.id];
        if (!hasMine(t) && typeof s === "number" && s < (t.songs || []).length) keep[t.id] = s;
      });
      state.selected = keep;
      document.title = g.title;
      $("title").textContent = g.title;
      $("desc").textContent = g.description || "";
      renderMeta();

      var mode = g.closed ? "results" : openTopics().length === 0 ? "voted" : "ballot";
      // 고르는 중인 투표지는 곡 구성이 그대로면 다시 그리지 않음 (선택이 날아가지 않게)
      var songsKey = JSON.stringify(g.topics.map(function (t) { return [t.id, t.title, t.songs, hasMine(t)]; }));
      if (!(silent && mode === "ballot" && state.mode === "ballot" && state.songsKey === songsKey)) {
        if (mode === "results") renderResults();
        else if (mode === "voted") renderVoted();
        else renderBallot();
      }
      state.mode = mode; state.songsKey = songsKey;
      startPolling();
    } catch (e) {
      if (silent) return;
      renderError("투표 정보를 불러오지 못했습니다", true);
    }
  }

  voteBtn.addEventListener("click", function () {
    if (state.busy) return;
    var open = openTopics();
    var missing = open.filter(function (t) { return typeof state.selected[t.id] !== "number"; });
    if (missing.length) {
      // 아직 고르지 않은 주제로 이동해서 알려줌
      var idx = topics().indexOf(missing[0]);
      var sec = $("topic-" + idx);
      if (sec) {
        sec.classList.add("missing");
        sec.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      return;
    }
    var html = "";
    open.forEach(function (t) {
      var i = state.selected[t.id];
      html += '<div class="picked">' + mark(i) + '<span class="title"><span class="lbl">' + esc(t.title) + "</span>" + esc(t.songs[i]) + "</span></div>";
    });
    cPicked.innerHTML = html;
    if (typeof dlg.showModal === "function") {
      dlg.returnValue = "";
      dlg.showModal();
      cOk.focus();
    } else {
      var txt = open.map(function (t) { return t.title + ": " + t.songs[state.selected[t.id]]; }).join("\n");
      if (window.confirm(txt + "\n\n이대로 투표할까요? 제출 후에는 바꿀 수 없습니다.")) submit();
    }
  });
  dlg.addEventListener("close", function () {
    if (dlg.returnValue === "ok") submit();
  });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close("cancel"); });

  var REASONS = {
    already_voted: "이 기기에서 이미 투표한 주제가 있습니다. 화면을 새로 불러왔습니다.",
    closed: "정해진 인원이 모두 투표해서 투표가 끝났습니다.",
    full: "참여 인원 상한에 도달해 더 이상 투표할 수 없습니다. 운영진에게 알려 주세요.",
    bad_song: "곡 목록이 바뀌었습니다. 다시 골라 주세요.",
    bad_topic: "주제 목록이 바뀌었습니다. 다시 골라 주세요."
  };

  async function submit() {
    if (state.busy) return;
    var choices = {};
    openTopics().forEach(function (t) {
      if (typeof state.selected[t.id] === "number") choices[t.id] = state.selected[t.id];
    });
    if (!Object.keys(choices).length) return;
    state.busy = true; syncChecked(); showNotice("");
    try {
      var r = await rpc("choir_cast_votes", { p_group: GROUP_ID, p_device: state.device, p_fp: state.fp, p_choices: choices });
      state.busy = false;
      if (r && r.ok) {
        state.selected = {};
        await load();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      var reason = r && r.reason;
      showNotice(REASONS[reason] || "투표를 저장하지 못했습니다. 잠시 뒤 다시 시도해 주세요.");
      if (reason === "bad_song" || reason === "bad_topic") state.selected = {};
      if (reason in REASONS && reason !== "full") await load(); else syncChecked();
    } catch (e) {
      state.busy = false;
      // 전송은 됐는데 응답만 끊겼을 수 있으니 서버에서 다시 확인
      // (화면을 지우지 않도록 조용히 확인만 하고, 저장된 게 확인될 때만 새로 그림)
      try {
        var g = await rpc("choir_group", { p_group: GROUP_ID, p_device: state.device });
        var savedNow = g && g.topics && g.topics.some(function (t) { return hasMine(t) && choices.hasOwnProperty(t.id); });
        if (savedNow) { state.selected = {}; await load(); return; }
      } catch (e2) {}
      showNotice("연결이 불안정해 투표가 저장되지 않았습니다. 선택은 그대로 두었으니 다시 눌러 주세요.");
      syncChecked();
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state.group && !state.busy && !dlg.open) load(true);
  });

  load();
})();
</script>
</body>
</html>
